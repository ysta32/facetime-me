<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page is the call: the sky follows the background you pick for the call, the phone stands in it,
     and the script you write is the start of the conversation thread. Pixel-notched edges echo the mascot. */
  :root {
    --sky-a: #CEC6F4; --sky-b: #FBD8C4; --ink: #2B2350; --ink-soft: #5D567F; --paper: #FFFFFF; --you: #ECE7FF;
    --pick: #6B52D1; --go: #30C25A; --go-deep: #1E9443; --stop: #F2453D; --cue: #FFD15C;
    --px: 'Pixelify Sans', ui-monospace, monospace; --text: 'Atkinson Hyperlegible', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
    color-scheme: light;
  }
  :root[data-sky="night"]    { --sky-a: #C9CDF2; --sky-b: #E7DDF7; --pick: #4F55C9; }
  :root[data-sky="daylight"] { --sky-a: #BFDDF8; --sky-b: #EAF5FF; --pick: #2F78C4; }
  :root[data-sky="mint"]     { --sky-a: #C3EEDD; --sky-b: #F0FBF5; --pick: #1F8A63; }
  :root[data-sky="terminal"] { --sky-a: #D3E8D2; --sky-b: #F2F7EE; --pick: #2D7A3A; }
  :root[data-sky="peach"]    { --sky-a: #FFD3C2; --sky-b: #FFF0E6; --pick: #C2522F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: linear-gradient(180deg, var(--sky-a), var(--sky-b) 70%) fixed; color: var(--ink); font: 400 16px/1.5 var(--text); -webkit-font-smoothing: antialiased; transition: background .4s; }
  button, textarea, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--pick); outline-offset: 3px; }

  /* Pixel-notched frame: a 3px ink line with the corner pixels knocked out. */
  .pxl { position: relative; background: var(--paper); box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
  .pxl.drop { box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), 6px 9px 0 rgb(43 35 80 / .14); }

  .top { max-width: 1180px; margin: 0 auto; padding: 22px 28px 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .mark { font: 600 26px/1 var(--px); margin: 0; }
  .top p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .real { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .real .status { font-size: 14px; color: var(--ink-soft); }

  .stagehall { max-width: 1180px; margin: 0 auto; padding: 26px 28px 40px; display: grid; grid-template-columns: auto minmax(0, 600px); gap: 64px; justify-content: center; align-items: start; }

  /* The phone */
  .stage { position: sticky; top: 20px; display: grid; justify-items: center; gap: 12px; }
  .phone { position: relative; height: min(78vh, 700px); aspect-ratio: 9 / 19.5; border-radius: 56px; background: #F7F5FB; padding: 10px; box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px rgb(43 35 80 / .12), 0 40px 60px -34px rgb(43 35 80 / .5); }
  .bezel { width: 100%; height: 100%; border-radius: 47px; background: #15122B; padding: 7px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: #000; }
  .screen canvas, .ghost canvas { position: absolute; top: 0; left: 50%; height: 100%; transform: translateX(-50%); image-rendering: pixelated; aspect-ratio: 240 / 427; }
  .ghost { position: absolute; inset: 17px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .ghost canvas { opacity: .3; }
  .phone.show-cut .screen { overflow: visible; }
  .phone.show-cut .ghost { opacity: 1; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 32%; height: 26px; border-radius: 20px; background: #000; z-index: 3; }
  .overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / .45); }
  .ring { justify-content: space-between; padding: 76px 18px 40px; background: linear-gradient(rgb(18 14 40 / .6), rgb(18 14 40 / .05) 42%, rgb(18 14 40 / .65)); }
  .ring .who { text-align: center; font: 500 30px/1.1 var(--px); }
  .ring .who small { display: block; font: 400 15px/1.4 var(--text); opacity: .85; margin-top: 6px; }
  .ring .row { display: flex; gap: 56px; }
  .round { width: 66px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; text-shadow: none; }
  .round svg { width: 28px; height: 28px; }
  .round.answer { background: #34C759; }
  .round.decline { background: #FF3B30; }
  .round.decline svg { transform: rotate(135deg); }
  .round-label { display: block; text-align: center; font-size: 13px; margin-top: 8px; }
  .incall { justify-content: flex-end; padding-bottom: 28px; pointer-events: none; }
  .incall .bar { pointer-events: auto; display: flex; gap: 20px; align-items: center; background: rgb(18 14 40 / .45); padding: 9px 14px; border-radius: 40px; backdrop-filter: blur(6px); }
  .incall .round { width: 52px; height: 52px; }
  .incall .round svg { width: 22px; height: 22px; }
  .round.mute { background: rgb(255 255 255 / .22); color: #fff; }
  .round.mute[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .timer { font: 500 15px/1 var(--px); color: #fff; min-width: 3em; text-align: center; }
  .poses { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; max-width: 330px; font-size: 14px; }
  .poses button { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; }
  .poses button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .check input { accent-color: var(--pick); width: 16px; height: 16px; margin: 0; }

  /* The thread: tabs, the facts, Claude's first line (editable), then the live call. */
  .thread { display: grid; gap: 22px; padding-top: 6px; }
  .tabs { display: flex; gap: 0; margin-bottom: -22px; position: relative; z-index: 1; flex-wrap: wrap; }
  .tabs button { border: 0; cursor: pointer; font: 500 16px/1 var(--px); padding: 11px 16px 13px; background: transparent; color: var(--ink-soft); }
  .tabs button[aria-pressed="true"] { background: #1D1838; color: #fff; }
  .term { background: #1D1838; color: #E9E6F8; padding: 14px 16px 16px; box-shadow: 6px 9px 0 rgb(43 35 80 / .14); }
  .term label { display: flex; justify-content: space-between; gap: 12px; font: 400 13px/1.3 var(--mono); color: #A69FD0; margin-bottom: 8px; }
  .term textarea { width: 100%; border: 0; background: transparent; color: inherit; font: 400 14px/1.55 var(--mono); resize: none; padding: 0; overflow: hidden; }
  .term textarea:focus { outline: none; }
  .term:focus-within { box-shadow: 0 0 0 3px var(--pick), 6px 9px 0 rgb(43 35 80 / .14); }
  .tabs + .term { padding-top: 18px; }
  .tabs:has(+ .term[hidden]) { margin-bottom: 0; }

  .msg { max-width: 86%; padding: 12px 16px; font-size: 16px; line-height: 1.45; }
  .msg.claude { justify-self: start; }
  .msg.you { justify-self: end; background: var(--you); }
  .msg.sys { justify-self: center; background: none; box-shadow: none; color: var(--ink-soft); font: 400 14px/1.3 var(--px); padding: 0; }
  .who-said { display: block; font: 500 13px/1 var(--px); color: var(--ink-soft); margin-bottom: 6px; }
  .opener { width: min(100%, 520px); }
  .opener textarea { display: block; width: 100%; border: 0; padding: 0; resize: none; background: transparent; font-size: 18px; line-height: 1.45; overflow: hidden; }
  .opener textarea:focus { outline: none; }
  .opener:focus-within { box-shadow: 0 -3px 0 var(--pick), 0 3px 0 var(--pick), -3px 0 0 var(--pick), 3px 0 0 var(--pick), 6px 9px 0 rgb(43 35 80 / .14); }
  .opener .hl { color: var(--ink-soft); font-size: 13px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cue { border: 0; background: var(--cue); color: var(--ink); font: 500 13px/1 var(--px); padding: 5px 8px; cursor: pointer; }
  .cue:hover { background: #FFC531; }
  .lat { margin-left: 10px; font: 500 12px/1 var(--px); color: var(--go-deep); white-space: nowrap; }
  .lat.slow { color: var(--stop); }
  .live { display: grid; gap: 14px; }
  .live:empty { display: none; }

  .go { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-top: 4px; }
  .ringbtn { display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; background: var(--go); color: #fff; font: 600 20px/1 var(--px); padding: 15px 24px 17px; box-shadow: 0 -3px 0 var(--go-deep), 0 3px 0 var(--go-deep), -3px 0 0 var(--go-deep), 3px 0 0 var(--go-deep), 0 8px 0 var(--go-deep); transition: transform .05s; }
  .ringbtn svg { width: 20px; height: 20px; }
  .ringbtn:active:not([disabled]) { transform: translateY(5px); box-shadow: 0 -3px 0 var(--go-deep), 0 3px 0 var(--go-deep), -3px 0 0 var(--go-deep), 3px 0 0 var(--go-deep); }
  .ringbtn[disabled] { opacity: .6; cursor: default; }
  .status { margin: 0; font-size: 14px; color: var(--ink-soft); min-height: 1.4em; }
  .status.error { color: var(--stop); }

  /* The dock: everything about how Claude sounds and looks, saved for real calls. */
  .dock { margin-top: 14px; }
  .dockin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .dockin > section:first-child { grid-column: 1 / -1; border-bottom: 3px dashed rgb(43 35 80 / .18); }
  .dockin > section { padding: 22px 24px 24px; min-width: 0; }
  .dockin > section:nth-child(3) { border-left: 3px dashed rgb(43 35 80 / .18); }
  .dock h2 { font: 500 18px/1.2 var(--px); margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .dock h2 small { font: 400 13px/1.2 var(--text); color: var(--ink-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 0; cursor: pointer; padding: 6px 11px; font-size: 14px; background: #F1EFF8; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip .on { display: inline-block; width: 7px; height: 7px; background: var(--go); margin-left: 7px; vertical-align: 1px; }
  .about { margin: 12px 0 0; font-size: 15px; }
  .about em { display: block; color: var(--ink-soft); margin-top: 4px; }
  .about textarea { width: 100%; margin-top: 4px; border: 2px solid #E3E0EE; padding: 8px 10px; resize: vertical; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 0; cursor: pointer; font: 500 15px/1 var(--px); padding: 9px 13px 10px; background: #F1EFF8; }
  .btn:hover:not([disabled]) { background: #E5E1F3; }
  .btn.solid { background: var(--ink); color: #fff; }
  .btn.solid:hover:not([disabled]) { background: #3B3270; }
  .btn[disabled] { background: none; color: var(--go-deep); cursor: default; padding-left: 0; }
  .btn.playing { background: var(--cue); }
  .note { font-size: 13px; color: var(--ink-soft); }
  .note.error { color: var(--stop); }
  .voice strong { font: 500 22px/1.1 var(--px); display: block; }
  .voice p { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
  details summary { cursor: pointer; font-size: 14px; color: var(--ink-soft); margin-top: 12px; }
  .voices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 170px; overflow: auto; }
  .voices button { border: 0; cursor: pointer; padding: 5px 9px; font-size: 13px; background: #F1EFF8; }
  .voices button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .skies { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .sky { border: 0; padding: 0; background: none; cursor: pointer; }
  .sky canvas { display: block; width: 100%; aspect-ratio: 240 / 427; image-rendering: pixelated; }
  .sky[aria-current="true"] canvas { outline: 3px solid var(--ink); outline-offset: 2px; }
  .sky.inuse::after { content: ""; display: block; width: 7px; height: 7px; background: var(--go); margin: 6px auto 0; }

  @media (max-width: 1020px) {
    .dockin { grid-template-columns: minmax(0, 1fr); }
    .dockin > section:nth-child(3) { border-left: 0; border-top: 3px dashed rgb(43 35 80 / .18); }
  }
  @media (max-width: 860px) {
    .stagehall { grid-template-columns: minmax(0, 1fr); gap: 34px; padding: 18px 16px 32px; }
    .stage { position: static; }
    .phone { height: min(70vh, 560px); }
    .top { padding-left: 16px; padding-right: 16px; }
    .real { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { body, .ghost, .ringbtn { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="mark">facetime-me</h1>
  <p>Practice calls with Claude. Nothing it asks to do actually runs.</p>
  <div class="real"><span class="status" id="callStatus" aria-live="polite"></span><button class="btn" id="callMe" title="Runs facetime-me --demo: a Terminal window opens and your phone rings">Ring my real phone</button></div>
</header>

<div class="stagehall">
  <div class="stage">
    <div class="phone" id="phone">
      <div class="ghost"><canvas id="ghost" width="240" height="427"></canvas></div>
      <div class="bezel"><div class="screen">
        <canvas id="screen" width="240" height="427" aria-label="Call screen"></canvas>
        <div class="island"></div>
        <div class="overlay ring" id="ringUi" hidden>
          <div class="who">Claude<small>FaceTime Video</small></div>
          <div class="row">
            <div><button class="round decline" id="decline" aria-label="Decline"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button><span class="round-label">Decline</span></div>
            <div><button class="round answer" id="answer" aria-label="Answer"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button><span class="round-label">Answer</span></div>
          </div>
        </div>
        <div class="overlay incall" id="callUi" hidden>
          <div class="bar">
            <button class="round mute" id="mute" aria-pressed="false" aria-label="Mute"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg></button>
            <span class="timer" id="timer">0:00</span>
            <button class="round decline" id="hangup" aria-label="Hang up"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button>
          </div>
        </div>
      </div></div>
    </div>
    <div class="poses" id="poses" role="group" aria-label="Preview a moment in the call"></div>
    <label class="check"><input type="checkbox" id="showCut"> Show what your iPhone crops</label>
  </div>

  <main class="thread">
    <div class="tabs" id="scenarios" role="group" aria-label="Why Claude calls"></div>
    <div class="term" id="factsBox">
      <label for="facts"><span>what happened</span><span>Claude answers questions from this</span></label>
      <textarea id="facts" rows="2" maxlength="1200" spellcheck="false"></textarea>
    </div>
    <div class="msg claude opener pxl drop">
      <label class="who-said" for="opener">Claude, the moment you pick up</label>
      <textarea id="opener" rows="1" maxlength="400"></textarea>
      <div class="hl" id="tags"></div>
    </div>
    <div class="live" id="chat" aria-live="polite"></div>
    <div class="go">
      <button class="ringbtn" id="ringMe"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg><span id="ringLabel">Ring me</span></button>
      <label class="check"><input type="checkbox" id="bargeIn"> On headphones, let me cut in</label>
    </div>
    <p class="status" id="status" aria-live="polite">Rings here in the browser. Talk out loud, it listens on your mic.</p>
    <div class="dock">
  <div class="dockin pxl drop">
    <section aria-labelledby="cast-h">
      <h2 id="cast-h">Personality <small>how it talks</small></h2>
      <div class="chips" id="cast" role="group" aria-labelledby="cast-h"></div>
      <div class="about" id="about"></div>
      <div class="row"><button class="btn" id="playPersona">Play</button><button class="btn solid" id="usePersona">Use on calls</button><span class="note" id="personaNote"></span></div>
    </section>
    <section aria-labelledby="voice-h">
      <h2 id="voice-h">Voice</h2>
      <div class="voice"><strong id="voiceName">Toby</strong><p id="voiceAbout">ElevenLabs</p></div>
      <div class="row"><button class="btn" id="playVoice">Play</button><span class="note" id="elNote"></span></div>
      <details id="elMore" hidden>
        <summary>Change voice</summary>
        <div class="voices" id="elVoices" role="group" aria-label="ElevenLabs voices"></div>
        <div class="row"><button class="btn solid" id="useEl">Use on calls</button></div>
      </details>
      <div id="oaVoices" hidden>
        <p class="note" id="voiceHint"></p>
        <div class="voices" id="voices" role="group" aria-label="OpenAI voices"></div>
        <div class="row"><button class="btn solid" id="useVoice">Use on calls</button><span class="note" id="voiceNote"></span></div>
      </div>
    </section>
    <section aria-labelledby="bg-h">
      <h2 id="bg-h">Background <small id="skyName"></small></h2>
      <div class="skies" id="backdrops"></div>
      <div class="row"><button class="btn solid" id="useTheme">Use on calls</button><span class="note" id="themeNote"></span></div>
    </section>
  </div>
</div>
  </main>
</div>


<script>
const W = 240, H = 427;
const state = { options: null, theme: 'night', persona: 'buddy', voice: null, pose: 'approve', chosen: {}, scenario: 'approve', scenarios: [], edited: {} };
const $ = id => document.getElementById(id);
const screen = $('screen').getContext('2d'), ghost = $('ghost').getContext('2d');
const stripTags = text => String(text).replace(/\[[a-z ]{1,24}\]\s*/gi, '').trim();
let audio = null, playingBtn = null;

async function api(path, init) {
  const res = await fetch(path, init);
  if (!res.ok) { let msg = `HTTP ${res.status}`; try { msg = (await res.json()).error ?? msg; } catch {} throw new Error(msg); }
  return res;
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
const frameOf = async (theme, scene) => new ImageData(new Uint8ClampedArray(await (await api(`/api/frame?theme=${theme}&scene=${scene}`)).arrayBuffer()), W, H);

// The phone screen: one frame at a time from the same renderer the real call uses.
async function loop() {
  for (;;) {
    const started = performance.now();
    try { const img = await frameOf(state.theme, call.state === 'idle' ? state.pose : 'live'); screen.putImageData(img, 0, 0); ghost.putImageData(img, 0, 0); } catch {}
    await new Promise(r => setTimeout(r, Math.max(0, 66 - (performance.now() - started))));
  }
}

const persona = () => state.options.personas.find(p => p.id === state.persona);
const voiceOf = () => state.voice ?? persona().voice;
const fit = box => { box.style.height = 'auto'; box.style.height = `${box.scrollHeight}px`; };

// ---------- The script ----------
async function loadScenarios() {
  const style = state.persona === 'custom' ? `&style=${encodeURIComponent(state.customStyle ?? '')}` : '';
  state.scenarios = (await (await api(`/api/practice/scenarios?persona=${state.persona}${style}`)).json()).scenarios;
  renderSetup();
}
const scenario = () => state.scenarios.find(s => s.id === state.scenario) ?? state.scenarios[0];
const defaultOpener = s => { const tag = state.chosen.tags?.[0]; return tag ? `[${tag}] ${s.opener}` : s.opener; };
function renderSetup() {
  $('scenarios').innerHTML = '';
  for (const s of state.scenarios) {
    const b = document.createElement('button');
    b.textContent = s.label; b.setAttribute('aria-pressed', s.id === state.scenario);
    b.onclick = () => { if (call.state !== 'idle') return; state.scenario = s.id; renderSetup(); };
    $('scenarios').append(b);
  }
  const s = scenario(), edits = state.edited[s.id] ?? {};
  $('opener').value = edits.opener ?? defaultOpener(s);
  $('facts').value = edits.facts ?? s.facts;
  $('factsBox').hidden = s.id === 'chat';
  fit($('opener')); fit($('facts'));

let ctx = null;

  const p = api('/api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.arrayBuffer());

// A soft two-note chime while it rings.
let ringTimer = null;

const YES = /\b(yes|yeah|yea|yep|yup|ya|ja|si|sure|ok|okay|alright|go|go ahead|do it|fix it|send it|approve|approved|allow|please|absolutely|definitely|of course|sounds good|let's go)\b/i;

async function connect(opener) {
  const s = scenario();
  const session = await (await post('/api/practice/start', { scenario: s.id, opener, facts: $('facts').value, persona: state.persona, customStyle: state.customStyle, voice: state.voice })).json();
  if (call.ended) return;

/** Speak a line. Scripted lines are not interruptible; without headphones the mic waits until Claude stops. */
function speak(text, { scripted = false, quiet = false, onFirstAudio } = {}) {

async function heardYes() {
  const since = call.speechStoppedAtMark ?? 0;
  for (let waited = 0; waited < 1800; waited += 100) {
    const said = call.heard.filter(h => h.at >= since - 50).map(h => h.text).join(' ');
    if (YES.test(said) && !NO.test(said)) return true;
    if (NO.test(said)) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return false;
}

async function onTool(name, callId, args) {
  const reply = output => send({ type: 'conversation.item.create', item: { type: 'function_call_output', call_id: callId, output } });
  const L = call.session.lines;
  if ((name === 'approve' || name === 'start_fix') && !(await heardYes())) {
    reply(L.notHeard); send({ type: 'response.create' });
    bubble('sys', 'It wanted to go ahead but did not hear a clear yes');
    return;
  }
  reply('Done.');
  const say = async text => { const item = speak(text, { scripted: true }); if (item) await item.finished; else await new Promise(r => setTimeout(r, 1800)); };
  if (name === 'approve') {
    look('done', { kind: 'done', title: args.always ? 'Always allowed' : 'Allowed', lines: ['Practice call: nothing ran'] }, { hearts: 3, hop: true });
    bubble('sys', args.always ? 'You said yes, always' : 'You said yes');
    await say(L.approved); return hangup('approved');
  }
  if (name === 'deny') {
    look('idle', { kind: 'error', title: 'Stopped', lines: [args.reason ?? 'You said no'] });
    bubble('sys', 'You said no');
    await say(L.denied); return hangup('denied');
  }
  if (name === 'start_fix') {
    bubble('sys', 'You said yes, so it acts out a fix');
    const ack = say(L.approved);
    look('reading', { kind: 'reading', input: { file_path: 'src/auth/login.js' }, output: 'export async function login(user) {\n  const token = await sign(user);\n  return { token };\n}' });
    await new Promise(r => setTimeout(r, 2600)); await ack;
    if (call.ended) return;
    look('testing', { kind: 'thinking', title: 'Running the tests' });
    await new Promise(r => setTimeout(r, 1600));
    if (call.ended) return;
    look('done', { kind: 'done', title: 'Fixed', tests: { pass: 12, fail: 0 }, lines: ['Practice call: nothing changed'] }, { sparkles: 8, hop: true });
    await say(`${L.fixed} ${L.bye}`); return hangup('fixed');

  for (const b of $('elVoices').children) b.setAttribute('aria-pressed', String(b.dataset.id === elPick));
  const saved = elPick === state.chosen.elevenVoice;
  $('useEl').disabled = saved; $('useEl').textContent = saved ? 'On your calls' : `Use ${v?.name ?? 'this voice'} on calls`;
}
async function loadEleven() {
  if (!state.chosen.eleven) return;
  try { elVoices = (await (await api('/api/eleven/voices')).json()).voices ?? []; } catch { elVoices = []; }
  // Your configured voice may not be in the list (keys without voices_read only see the built-ins).
  if (!elVoices.some(v => v.id === state.chosen.elevenVoice)) elVoices.unshift({ id: state.chosen.elevenVoice, name: state.chosen.elevenVoice === 'Z750C5Od5qXCE2K3aYgR' ? 'Toby' : 'Your voice', about: '' });
  elPick = state.chosen.elevenVoice;
  $('elMore').hidden = false;
  for (const v of elVoices) {
    const b = document.createElement('button');
    b.dataset.id = v.id; b.textContent = v.name;
    if (v.about) b.title = v.about;
    b.onclick = () => { elPick = v.id; paintEleven(); playBlob(`/api/eleven/voice?persona=${state.persona === 'custom' ? 'classic' : state.persona}&voice=${v.id}`, null, $('elNote')); };
    $('elVoices').append(b);
  }
  paintEleven();
  $('useEl').onclick = () => choose({ elevenVoice: elPick }).then(() => { prefetched.clear(); paintEleven(); prefetchSoon(); $('elNote').textContent = 'Saved for your next call.'; });
}

$('useTheme').onclick = () => choose({ theme: state.theme }).then(() => { $('themeNote').textContent = 'Saved for your next call.'; });
$('showCut').onchange = e => $('phone').classList.toggle('show-cut', e.target.checked);

(async () => {
  state.options = await (await api('/api/options')).json();
  state.chosen = state.options.chosen; state.customStyle = state.chosen.customStyle;
  Object.assign(state, { theme: state.chosen.theme, persona: state.chosen.personality, voice: state.chosen.voice });
  for (const t of state.options.themes) {
    const b = document.createElement('button');
    b.className = 'sky'; b.dataset.id = t.id; b.title = t.name; b.setAttribute('aria-label', t.name);
    b.innerHTML = `<canvas width="${W}" height="${H}"></canvas>`;
    b.onclick = () => { state.theme = t.id; render(); };
    $('backdrops').append(b);
    const paint = () => frameOf(t.id, 'hello').then(img => b.querySelector('canvas').getContext('2d').putImageData(img, 0, 0)).catch(() => {});
    paint(); setTimeout(paint, 900);
  }
  render(); renderTags(); loadScenarios(); loadEleven();
  loop();
})();

// "Ring my real phone": runs facetime-me --demo and follows its progress.
const STEPS = { ringing: 'Ringing your phone…', answered: 'Connected. Say yes to let it fix the build.', 'fix-start': 'Fixing the build…', 'fix-ok': 'Build fixed.', 'fix-failed': 'The fix did not work.', 'summary-sent': 'Summary texted.', 'call-done': 'Call finished.' };
let callTimer = null;
$('callMe').onclick = async () => {
  const btn = $('callMe'), status = $('callStatus');
  btn.disabled = true; status.className = 'status'; status.textContent = 'Starting: a Terminal window counts down from 5.';
  try { await api('/api/call', { method: 'POST' }); }
  catch (error) { status.className = 'status error'; status.textContent = error.message; btn.disabled = false; return; }
  clearInterval(callTimer);
  const began = Date.now();
  callTimer = setInterval(async () => {
    try {
      const { events } = await (await api('/api/call')).json();
      const last = events.at(-1);
      if (last) status.textContent = last.startsWith('call-failed') ? `Call failed: ${last.slice(12)}` : STEPS[last] ?? last;
      if (last === 'call-done' && !events.includes('answered')) status.textContent = 'You did not pick up in time.';
      if (last === 'call-done' || last?.startsWith('call-failed') || Date.now() - began > 4 * 60000) { clearInterval(callTimer); btn.disabled = false; btn.textContent = 'Ring my real phone'; }
    } catch {}
  }, 1000);
};
</script>
